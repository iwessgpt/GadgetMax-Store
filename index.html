<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GadgetMax</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body id="page-index">
    <div class="background-effects">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <header>
        <div class="container header-container">
            <a href="index.html" class="logo-link"><h1 id="store-title">GadgetMax</h1></a>
            <p id="store-desc">Premium Gadgets and Accessories</p>
        </div>
    </header>

    <main class="container">
        <!-- Product Grid -->
        <section class="product-grid" id="product-grid">
            <!-- Products will be injected here by app.js -->
        </section>
    </main>

    <footer>
        <p>&copy; 2026 GadgetMax. All rights reserved.</p>
    </footer>

    <!-- Load the configuration and logic -->
    <!-- PapaParse for CSV processing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="products.js"></script>
    <script src="app.js"></script>
</body>
</html>
